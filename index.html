<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FilamentHub — Inventaire Cloud</title>
  
  <!-- Optimisation iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Filaments">
  <link rel="apple-touch-icon" href="https://api.iconify.design/lucide:cylinder.svg?color=%2310b981">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#10b981', 600: '#059669' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-emerald-500/30">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
          <i data-lucide="cylinder" class="w-4 h-4"></i>
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight">FilamentHub</h1>
          <div class="flex items-center gap-1.5 text-xs text-zinc-400 font-mono">
            <span>1.75 mm</span>
            <span>•</span>
            <span id="syncStatus" class="inline-flex items-center gap-1 text-emerald-400">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Synchronisé
            </span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="exportData()" class="p-2 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 rounded-lg transition" title="Télécharger une sauvegarde">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
        <button onclick="openModal()" class="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium text-xs shadow-lg shadow-emerald-950 transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Ajouter</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4">

    <!-- Métriques rapides -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-zinc-900 border border-zinc-800/80 rounded-xl p-3 text-center">
        <span class="text-[11px] font-medium text-zinc-400 uppercase tracking-wider block">Bobines</span>
        <span id="statTotalSpools" class="text-lg font-bold text-zinc-100">0</span>
      </div>
      <div class="bg-zinc-900 border border-zinc-800/80 rounded-xl p-3 text-center">
        <span class="text-[11px] font-medium text-zinc-400 uppercase tracking-wider block">Stock total</span>
        <span id="statTotalWeight" class="text-lg font-bold text-emerald-400">0 kg</span>
      </div>
      <div class="bg-zinc-900 border border-zinc-800/80 rounded-xl p-3 text-center">
        <span class="text-[11px] font-medium text-zinc-400 uppercase tracking-wider block">Fins de bobine</span>
        <span id="statLowSpools" class="text-lg font-bold text-amber-400">0</span>
      </div>
    </div>

    <!-- Filtres & Recherche -->
    <div class="space-y-2">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-zinc-500"></i>
        <input type="text" id="searchInput" oninput="renderSpools()" placeholder="Rechercher par marque, couleur, note..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-9 pr-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500 transition">
      </div>
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs" id="materialFilters">
        <button onclick="setMaterialFilter('ALL')" class="filter-btn active px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-medium">Tout</button>
        <button onclick="setMaterialFilter('PLA')" class="filter-btn px-3 py-1 rounded-full bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200">PLA</button>
        <button onclick="setMaterialFilter('PETG')" class="filter-btn px-3 py-1 rounded-full bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200">PETG</button>
        <button onclick="setMaterialFilter('TPU')" class="filter-btn px-3 py-1 rounded-full bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200">TPU</button>
      </div>
    </div>

    <!-- Grille des bobines -->
    <div id="spoolsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>

    <!-- État vide -->
    <div id="emptyState" class="hidden text-center py-12 space-y-3">
      <div class="w-12 h-12 mx-auto rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-500">
        <i data-lucide="box" class="w-6 h-6"></i>
      </div>
      <p class="text-zinc-400 text-sm">Aucune bobine dans l'inventaire.</p>
    </div>
  </main>

  <!-- Modal Ajout / Modification -->
  <div id="spoolModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-zinc-900 border border-zinc-800 w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between p-4 border-b border-zinc-800">
        <h2 id="modalTitle" class="text-base font-bold text-zinc-100">Ajouter une bobine</h2>
        <button onclick="closeModal()" class="text-zinc-400 hover:text-zinc-200 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="spoolForm" onsubmit="saveSpool(event)" class="p-4 space-y-4 overflow-y-auto flex-1">
        <input type="hidden" id="spoolId">

        <!-- Marque -->
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Marque</label>
          <div class="grid grid-cols-3 gap-1.5 mb-2">
            <button type="button" onclick="selectBrand('Anycubic')" class="brand-btn px-2 py-1.5 rounded-lg border border-zinc-800 bg-zinc-950 text-xs text-zinc-300 hover:border-zinc-700">Anycubic</button>
            <button type="button" onclick="selectBrand('Sunlu')" class="brand-btn px-2 py-1.5 rounded-lg border border-zinc-800 bg-zinc-950 text-xs text-zinc-300 hover:border-zinc-700">Sunlu</button>
            <button type="button" onclick="selectBrand('Bambu Lab')" class="brand-btn px-2 py-1.5 rounded-lg border border-zinc-800 bg-zinc-950 text-xs text-zinc-300 hover:border-zinc-700">Bambu Lab</button>
          </div>
          <input type="text" id="brandInput" placeholder="Ou saisir une autre marque..." required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Matière -->
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Matière</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="material" value="PLA" class="peer hidden" checked>
              <div class="text-center py-2 rounded-lg border border-zinc-800 bg-zinc-950 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 peer-checked:text-emerald-400 text-xs font-semibold">PLA</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="material" value="PETG" class="peer hidden">
              <div class="text-center py-2 rounded-lg border border-zinc-800 bg-zinc-950 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 peer-checked:text-emerald-400 text-xs font-semibold">PETG</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="material" value="TPU" class="peer hidden">
              <div class="text-center py-2 rounded-lg border border-zinc-800 bg-zinc-950 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 peer-checked:text-emerald-400 text-xs font-semibold">TPU</div>
            </label>
          </div>
        </div>

        <!-- Couleur -->
        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2">
            <label class="block text-xs font-medium text-zinc-400 mb-1.5">Nom de couleur</label>
            <input type="text" id="colorNameInput" placeholder="Ex: Blanc, Noir, Gris clair..." required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1.5">Aperçu</label>
            <input type="color" id="colorHexInput" value="#ffffff" class="w-full h-[38px] rounded-lg bg-zinc-950 border border-zinc-800 cursor-pointer p-0.5">
          </div>
        </div>

        <!-- % Restant -->
        <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-800/80 space-y-2.5">
          <div class="flex items-center justify-between text-xs">
            <span class="font-medium text-zinc-300">Niveau restant :</span>
            <span class="font-mono font-bold text-emerald-400 text-sm"><span id="percentDisplay">100</span> % <span class="text-zinc-500 font-normal text-xs">(~<span id="gramDisplay">1000</span>g)</span></span>
          </div>
          <input type="range" id="percentRange" min="0" max="100" step="5" value="100" oninput="updatePercentDisplays(this.value)" class="w-full accent-emerald-500 cursor-pointer">
          <div class="flex justify-between gap-1">
            <button type="button" onclick="setPercentQuick(100)" class="flex-1 py-1 bg-zinc-900 border border-zinc-800 text-[11px] rounded text-zinc-400 hover:text-zinc-200">100%</button>
            <button type="button" onclick="setPercentQuick(75)" class="flex-1 py-1 bg-zinc-900 border border-zinc-800 text-[11px] rounded text-zinc-400 hover:text-zinc-200">75%</button>
            <button type="button" onclick="setPercentQuick(50)" class="flex-1 py-1 bg-zinc-900 border border-zinc-800 text-[11px] rounded text-zinc-400 hover:text-zinc-200">50%</button>
            <button type="button" onclick="setPercentQuick(25)" class="flex-1 py-1 bg-zinc-900 border border-zinc-800 text-[11px] rounded text-zinc-400 hover:text-zinc-200">25%</button>
            <button type="button" onclick="setPercentQuick(10)" class="flex-1 py-1 bg-zinc-900 border border-zinc-800 text-[11px] rounded text-zinc-400 hover:text-zinc-200">10%</button>
          </div>
        </div>

        <!-- Note / Emplacement -->
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Note / Emplacement (optionnel)</label>
          <input type="text" id="notesInput" placeholder="Ex: Étagère haut, buse 0.4 requise..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-emerald-500">
        </div>

        <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium text-sm transition shadow-lg shadow-emerald-950">
          Enregistrer
        </button>
      </form>
    </div>
  </div>

  <!-- Intégration Firebase Realtime Database -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAmkcy-NSMwZtsBIS3YdGTN6LZdaWdh8eo",
      authDomain: "inventaire-filament.firebaseapp.com",
      databaseURL: "https://inventaire-filament-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "inventaire-filament",
      storageBucket: "inventaire-filament.firebasestorage.app",
      messagingSenderId: "252433237067",
      appId: "1:252433237067:web:34d10e82f1022cd81d39ce",
      measurementId: "G-TVCM5TCH6Q"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const spoolsRef = ref(db, 'spools');

    let spools = [];
    let currentFilter = 'ALL';

    // Écoute en temps réel
    onValue(spoolsRef, (snapshot) => {
      const data = snapshot.val();
      spools = [];
      if (data) {
        Object.keys(data).forEach(key => {
          spools.push({ id: key, ...data[key] });
        });
      }
      spools.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      renderSpools();
      document.getElementById('syncStatus').innerHTML = `
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Synchronisé
      `;
    }, (error) => {
      console.error(error);
      document.getElementById('syncStatus').innerHTML = `
        <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> Erreur Cloud
      `;
    });

    window.selectBrand = (name) => {
      document.getElementById('brandInput').value = name;
    };

    window.updatePercentDisplays = (val) => {
      document.getElementById('percentDisplay').innerText = val;
      document.getElementById('gramDisplay').innerText = Math.round((val / 100) * 1000);
    };

    window.setPercentQuick = (val) => {
      document.getElementById('percentRange').value = val;
      window.updatePercentDisplays(val);
    };

    window.openModal = (editId = null) => {
      const form = document.getElementById('spoolForm');
      form.reset();
      if (editId) {
        const item = spools.find(s => s.id === editId);
        if (!item) return;
        document.getElementById('modalTitle').innerText = 'Modifier la bobine';
        document.getElementById('spoolId').value = item.id;
        document.getElementById('brandInput').value = item.brand;
        document.getElementById('colorNameInput').value = item.colorName;
        document.getElementById('colorHexInput').value = item.colorHex || '#ffffff';
        document.getElementById('notesInput').value = item.notes || '';
        document.getElementById('percentRange').value = item.percent;
        window.updatePercentDisplays(item.percent);
        const radio = form.querySelector(`input[name="material"][value="${item.material}"]`);
        if (radio) radio.checked = true;
      } else {
        document.getElementById('modalTitle').innerText = 'Ajouter une bobine';
        document.getElementById('spoolId').value = '';
        window.setPercentQuick(100);
      }
      document.getElementById('spoolModal').classList.remove('hidden');
    };

    window.closeModal = () => {
      document.getElementById('spoolModal').classList.add('hidden');
    };

    window.saveSpool = async (e) => {
      e.preventDefault();
      const id = document.getElementById('spoolId').value || ('spool_' + Date.now());
      const brand = document.getElementById('brandInput').value.trim();
      const material = document.querySelector('input[name="material"]:checked').value;
      const colorName = document.getElementById('colorNameInput').value.trim();
      const colorHex = document.getElementById('colorHexInput').value;
      const percent = parseInt(document.getElementById('percentRange').value, 10);
      const notes = document.getElementById('notesInput').value.trim();

      const spoolData = {
        brand,
        material,
        colorName,
        colorHex,
        percent,
        notes,
        updatedAt: Date.now()
      };

      await set(ref(db, `spools/${id}`), spoolData);
      window.closeModal();
    };

    window.adjustPercent = async (id, delta) => {
      const item = spools.find(s => s.id === id);
      if (!item) return;
      const newPercent = Math.min(100, Math.max(0, item.percent + delta));
      await update(ref(db, `spools/${id}`), {
        percent: newPercent,
        updatedAt: Date.now()
      });
    };

    window.deleteSpool = async (id) => {
      if (confirm('Supprimer cette bobine ?')) {
        await remove(ref(db, `spools/${id}`));
      }
    };

    window.setMaterialFilter = (mat) => {
      currentFilter = mat;
      document.querySelectorAll('#materialFilters button').forEach(b => {
        b.className = 'filter-btn px-3 py-1 rounded-full bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-zinc-200';
      });
      event.target.className = 'filter-btn active px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-medium';
      renderSpools();
    };

    window.renderSpools = () => {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('spoolsGrid');
      const empty = document.getElementById('emptyState');

      const filtered = spools.filter(s => {
        const matchFilter = currentFilter === 'ALL' || s.material === currentFilter;
        const matchSearch = (s.brand || '').toLowerCase().includes(query) || 
                            (s.colorName || '').toLowerCase().includes(query) || 
                            (s.material || '').toLowerCase().includes(query) ||
                            (s.notes && s.notes.toLowerCase().includes(query));
        return matchFilter && matchSearch;
      });

      const totalWeight = spools.reduce((acc, s) => acc + (s.percent * 10), 0);
      document.getElementById('statTotalSpools').innerText = spools.length;
      document.getElementById('statTotalWeight').innerText = (totalWeight / 1000).toFixed(2) + ' kg';
      document.getElementById('statLowSpools').innerText = spools.filter(s => s.percent <= 20).length;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = filtered.map(s => {
        const grams = Math.round((s.percent / 100) * 1000);
        const barColor = s.percent > 50 ? 'bg-emerald-500' : s.percent > 20 ? 'bg-amber-500' : 'bg-rose-500';

        return `
          <div class="bg-zinc-900 border border-zinc-800/90 rounded-xl p-3.5 space-y-3 relative overflow-hidden">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-2.5">
                <span class="w-4 h-4 rounded-full border border-zinc-700 shadow-sm shrink-0" style="background-color: ${s.colorHex}"></span>
                <div>
                  <h3 class="text-sm font-bold text-zinc-100 leading-none">${s.brand}</h3>
                  <span class="text-xs text-zinc-400">${s.colorName}</span>
                </div>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 border border-zinc-700/60">${s.material}</span>
                <button onclick="openModal('${s.id}')" class="p-1 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 rounded">
                  <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                </button>
                <button onclick="deleteSpool('${s.id}')" class="p-1 text-zinc-400 hover:text-rose-400 hover:bg-zinc-800 rounded">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>

            <div class="space-y-1">
              <div class="flex justify-between text-xs font-mono">
                <span class="text-zinc-400">Reste: <strong class="text-zinc-200">${s.percent}%</strong> (~${grams}g)</span>
                <span class="text-[11px] text-zinc-500">1.75mm</span>
              </div>
              <div class="w-full bg-zinc-950 h-2 rounded-full overflow-hidden border border-zinc-800/80">
                <div class="${barColor} h-full transition-all duration-300" style="width: ${s.percent}%"></div>
              </div>
            </div>

            <div class="flex items-center justify-between pt-1 border-t border-zinc-800/50">
              <span class="text-[11px] text-zinc-500 truncate max-w-[150px]">${s.notes || 'Aucune note'}</span>
              <div class="flex items-center gap-1">
                <button onclick="adjustPercent('${s.id}', -10)" class="px-2 py-1 bg-zinc-950 hover:bg-zinc-800 border border-zinc-800 text-[11px] font-mono rounded text-zinc-300">-10%</button>
                <button onclick="adjustPercent('${s.id}', 10)" class="px-2 py-1 bg-zinc-950 hover:bg-zinc-800 border border-zinc-800 text-[11px] font-mono rounded text-zinc-300">+10%</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    };

    window.exportData = () => {
      const blob = new Blob([JSON.stringify(spools, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `inventaire_filaments_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    lucide.createIcons();
  </script>
</body>
</html>
